<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Freezer 3D</title>
  <style>
    html,body{height:100%;margin:0;background:#0b1220;color:#e7eefc;font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono","Courier New", monospace;}
    #topbar{
      position:fixed;left:12px;right:12px;top:10px;
      display:flex;gap:10px;align-items:center;justify-content:space-between;
      padding:10px 12px;border:1px solid rgba(255,255,255,.12);
      border-radius:12px;background:rgba(20,30,55,.55);backdrop-filter: blur(10px);
      z-index:10;
    }
    .pill{padding:6px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.14);background:rgba(0,0,0,.18);}
    a{color:#9cb0d8;text-decoration:none}
    a:hover{text-decoration:underline}
    #msg{opacity:.85;font-size:13px}
    #canvasWrap{position:fixed;inset:0;}
    #fallback{
      position:fixed;left:12px;right:12px;bottom:12px;
      padding:10px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.12);
      background:rgba(20,30,55,.55);
      display:none;
    }
  </style>
</head>
<body>
  <div id="topbar">
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <div class="pill">🧊 Freezer 3D</div>
      <div class="pill" id="hubPill">hub: …</div>
      <div class="pill" id="nodePill">nodes: …</div>
      <div class="pill" id="modePill">mode: …</div>
      <div class="pill"><a href="/ui/freezer_ui.html">table view</a></div>
    </div>
    <div id="msg">drag = orbit • wheel = zoom • right-drag = pan</div>
  </div>

  <div id="canvasWrap"></div>

  <div id="fallback"></div>

  <script type="module" src="/ui/freezer_3d.js"></script>
</body>
</html>
